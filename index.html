<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn With P K PANKAJ - Science, education, school activities, experiments and learning resources for students.">
    <title>Learn With P K PANKAJ - होमपेज</title>
    <style>
        :root {
            --primary: #0d47a1;
            --primary-light: #1565c0;
            --accent: #fbc02d;
            --ink: #1f2937;
            --muted: #5b6472;
            --surface: #ffffff;
            --soft: #eef5ff;
            --line: #d8e2f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans Devanagari", Arial, sans-serif;
            background: #f4f7fb;
            color: var(--ink);
            line-height: 1.6;
        }

        .site-wrap {
            max-width: 1180px;
            margin: 0 auto;
            background: var(--surface);
            min-height: 100vh;
            box-shadow: 0 10px 35px rgba(13, 71, 161, 0.08);
        }

        .top-strip {
            background: var(--primary);
            color: #ffffff;
            padding: 10px 22px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .banner {
            padding: 16px 18px 10px;
            background: linear-gradient(180deg, #ffffff, #eef5ff);
        }

        .banner img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(13, 71, 161, 0.2);
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--primary);
            border-bottom: 4px solid var(--accent);
        }

        .navbar ul {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
        }

        .navbar li {
            position: relative;
        }

        .navbar a {
            display: block;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 15px;
        }

        .navbar a:hover,
        .dropdown:hover .dropbtn {
            background: var(--primary-light);
            color: var(--accent);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 250px;
            background: #ffffff;
            border: 1px solid var(--line);
            border-top: 4px solid var(--accent);
            box-shadow: 0 12px 28px rgba(31, 41, 55, 0.16);
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--ink);
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 1px solid #eef2f7;
        }

        .dropdown-content a:hover {
            color: var(--primary);
            background: var(--soft);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        main {
            padding: 26px 22px 36px;
        }

        .intro {
            display: grid;
            grid-template-columns: 1.5fr 0.9fr;
            gap: 24px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .intro h1 {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: clamp(30px, 4vw, 48px);
            line-height: 1.1;
        }

        .tagline {
            color: var(--muted);
            font-size: 18px;
            margin: 0 0 18px;
        }

        .quick-card {
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }

        .quick-card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 22px;
        }

        .cta-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 6px;
            padding: 11px 16px;
            font-weight: 700;
            border: 1px solid var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--primary);
        }

        .section-title {
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
            padding-bottom: 8px;
            margin: 32px 0 18px;
            font-size: 26px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
            background: #ffffff;
            box-shadow: 0 6px 16px rgba(13, 71, 161, 0.06);
        }

        .card h3 {
            margin: 0 0 8px;
            color: var(--primary-light);
            font-size: 20px;
        }

        .card p {
            margin: 0;
            color: var(--muted);
        }

        .project-list {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .project-list li {
            background: #f9fbff;
            border-left: 5px solid var(--primary);
            border-radius: 6px;
            padding: 14px 16px;
        }

        .links-box {
            margin-top: 34px;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: #ffffff;
            padding: 24px;
            border-radius: 8px;
        }

        .links-box h2 {
            margin: 0 0 10px;
            color: #ffffff;
        }

        .links-box a {
            color: var(--accent);
            font-weight: 800;
            text-decoration: none;
        }

        .links-box a:hover {
            text-decoration: underline;
        }

        footer {
            padding: 18px 22px;
            background: #102a4c;
            color: #dbeafe;
            text-align: center;
            font-size: 14px;
        }

            .top-strip {
                display: block;
                text-align: center;
            }

            .navbar {
                position: static;
            }

            .navbar ul {
                display: block;
            }

            .navbar a {
                border-bottom: 1px solid rgba(255,255,255,0.14);
            }

            .dropdown-content {
                position: static;
                display: block;
